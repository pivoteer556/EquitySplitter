name: Deploy Frontend

# Same gating as Deploy (backend): runs only after CI succeeded for a push to master.
# Token-based upload to the Static Web App, so no OIDC login and no repo write access.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Never overlap deploys, and never kill one mid-flight.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # event == 'push' also excludes fork PRs whose head branch happens to be named "master".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.event == 'push')
    steps:
      # Deploy exactly the commit CI validated, not whatever master has moved on to.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci
        working-directory: frontend/app
      # Production configuration is the default; it bakes in the live API URL.
      - run: npm run build
        working-directory: frontend/app

      # Build is done above, so the action only uploads the finished output
      # (index.html and staticwebapp.config.json sit at the root of this directory).
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/app/dist/app/browser
          skip_app_build: true
