name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # Lint once (not per matrix leg); ruff config lives in pyproject.toml.
      - run: ruff check .
        if: matrix.python-version == '3.12'
      # Type-check once; mypy config (packages = ["app"]) lives in pyproject.toml.
      - run: mypy
        if: matrix.python-version == '3.12'
      # Fail the build if a production pin (requirements.txt, what Docker ships) has a known CVE.
      # Audits requirements.txt only, not the dev tools; runs once, and needs network (PyPI/OSV).
      - run: pip-audit -r requirements.txt
        if: matrix.python-version == '3.12'

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equity_splitter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/equity_splitter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci
      # Karma runs the specs in headless Chrome, which ubuntu-latest has preinstalled.
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npm run build

  e2e:
    # Playwright suite (frontend/app/e2e) against a real local backend and a throwaway Postgres.
    # Port 55432 matches the DB url hard-coded in playwright.config.ts; reset-db.py recreates equity_e2e.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_PYTHON: python
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci
        working-directory: frontend/app
      # Chrome is preinstalled on ubuntu-latest; no Playwright browser download.
      - run: npx playwright test
        working-directory: frontend/app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: frontend/app/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t equity-splitter-api .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
