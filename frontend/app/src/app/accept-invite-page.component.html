<div class="invite-shell">
  <h1>Accept your invite</h1>

  @if (hasToken) {
    <form (submit)="$event.preventDefault(); accept(pw.value)">
      <label for="invite-password">New password</label>
      <input #pw id="invite-password" name="password" type="password" autocomplete="new-password" required
        minlength="10" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{10,}"
        title="At least 10 characters with a lowercase letter, an uppercase letter, a digit and a symbol."
        aria-describedby="invite-hint"
        (input)="cf.setCustomValidity(cf.value === pw.value ? '' : 'Passwords do not match')" />
      <p id="invite-hint">At least 10 characters, with a lowercase letter, an uppercase letter, a digit and a symbol.</p>
      <label for="invite-confirm">Confirm password</label>
      <input #cf id="invite-confirm" name="confirm" type="password" autocomplete="new-password" required
        (input)="cf.setCustomValidity(cf.value === pw.value ? '' : 'Passwords do not match')" />
      <button type="submit" [disabled]="loading">{{ loading ? 'Saving...' : 'Set password' }}</button>
    </form>
  } @else {
    <p class="error" role="alert">This invite link is missing its token. Open the link from your invite email again.</p>
  }

  @if (error) {
    <p class="error" role="alert">{{ error }}</p>
  }
</div>
