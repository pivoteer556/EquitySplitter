<div class="login-shell">
  <header class="hero">
    <p class="eyebrow">Shared Mortgage Platform</p>
    <h1>Institution Access</h1>
    <p>Sign in to your lending institution.</p>
  </header>

  <section>
    <h2>Sign In</h2>
    <form id="signin-form" (ngSubmit)="login()" ngNativeValidate>
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="username" required [(ngModel)]="loginEmail" />
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required [(ngModel)]="loginPassword" />
      <button type="submit" [disabled]="loading">{{ loading ? 'Signing in...' : 'Login' }}</button>
    </form>
  </section>

  <p><a routerLink="/buyer">Looking to buy? Sign in as a buyer</a></p>

  @if (error) {
    <pre class="error" role="alert">{{ error }}</pre>
  }

  @if (lastResponse) {
    <pre>{{ lastResponse }}</pre>
  }
</div>
