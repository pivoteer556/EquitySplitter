<main>
  <h1>Buyer access</h1>

  <form aria-label="Sign in" (submit)="$event.preventDefault(); signIn(se.value, sp.value)">
    <h2>Sign in</h2>
    <label for="buyer-signin-email">Email</label>
    <input #se id="buyer-signin-email" name="email" type="email" autocomplete="username" required />
    <label for="buyer-signin-password">Password</label>
    <input #sp id="buyer-signin-password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" [disabled]="signInLoading">{{ signInLoading ? 'Signing in...' : 'Sign in' }}</button>
    @if (signInError) {
      <p role="alert">{{ signInError }}</p>
    }
  </form>

  <details>
    <summary>New here? Create an account</summary>
    <form aria-label="Create account" (submit)="$event.preventDefault(); register(rn.value, re.value, rp.value)">
      <label for="buyer-register-name">Name</label>
      <input #rn id="buyer-register-name" name="name" type="text" autocomplete="name" required />
      <label for="buyer-register-email">Email</label>
      <input #re id="buyer-register-email" name="email" type="email" autocomplete="email" required />
      <label for="buyer-register-password">Password</label>
      <input #rp id="buyer-register-password" name="password" type="password" autocomplete="new-password" required
        minlength="10" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{10,}"
        title="At least 10 characters with a lowercase letter, an uppercase letter, a digit and a symbol."
        passwordrules="minlength: 10; required: lower; required: upper; required: digit; required: special;"
        aria-describedby="buyer-register-hint" />
      <p id="buyer-register-hint">At least 10 characters, with a lowercase letter, an uppercase letter, a digit and a symbol.</p>
      <button type="submit" [disabled]="registerLoading">{{ registerLoading ? 'Creating...' : 'Create account' }}</button>
      @if (registerError) {
        <p role="alert">{{ registerError }}</p>
      }
    </form>
  </details>

  <p><a routerLink="/login">Officer or lender? Institution sign-in</a></p>
</main>
