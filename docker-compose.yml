services:
  db:
    image: postgres:16-alpine
    container_name: equitysplitter-db
    environment:
      POSTGRES_DB: equity_splitter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equity_splitter"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equitysplitter-api
    environment:
      APP_NAME: Equity Splitter API
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/equity_splitter
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    restart: unless-stopped

volumes:
  postgres_data: